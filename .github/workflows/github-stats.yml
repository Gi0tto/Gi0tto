name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # once a day at midnight UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&count_private=true&show_icons=true&theme=github_dark_dimmed
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=github_dark_dimmed&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # The streak service is shared and sometimes down: on failure the
      # old card stays in place instead of a broken image.
      - name: Generate streak card
        run: |
          curl -sS --fail --max-time 60 -o /tmp/streak.svg \
            "https://streak-stats.demolab.com/?user=${{ github.repository_owner }}&background=22272E&border=444C56&stroke=444C56&ring=00AEFF&fire=00AEFF&currStreakNum=ADBAC7&sideNums=ADBAC7&currStreakLabel=00AEFF&sideLabels=00AEFF&dates=768390" \
            && grep -q '<svg' /tmp/streak.svg && mv /tmp/streak.svg profile/streak.svg \
            || echo "::warning::streak card not updated"

      - name: Generate activity graph
        run: python3 .github/scripts/activity_graph.py ${{ github.repository_owner }} profile/activity.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg profile-3d-contrib
          git commit -m "Update README cards" || exit 0
          git push

  snake:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0086c4&color_dots=#ebedf0,#b3e3ff,#66c9ff,#1aafff,#0086c4
            dist/snake-dark.svg?palette=github-dark&color_snake=#e6edf3&color_dots=#2d333b,#0a3a52,#00688f,#008cc2,#00AEFF

      # Lives on its own branch so it never races the commit above.
      - name: Push snake to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
